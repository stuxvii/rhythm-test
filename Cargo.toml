[package]
name = "ab93qcp" # acidbox93's quaver chart player
version = "1.0.0"
edition = "2024"

[dependencies]
msgbox = "0.7.0"
raylib = "5.5.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"

[profile.release]
panic = "abort"
opt-level = 3
strip = "symbols"
