[package]
name = "ab93rgcp" # acidbox93's rhythm game chart player
version = "1.0.0"
edition = "2024"

[dependencies]
raylib = { version = "6.0.0", features = ["serde", "SUPPORT_FILEFORMAT_JPG"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"

[profile.release]
panic = "abort"
opt-level = "z"
strip = "symbols"
